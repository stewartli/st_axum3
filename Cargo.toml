[package]
name = "st_axum3"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"
future-utils = "0.12.1"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = [
  "fs",
  "trace",
  "timeout",
  "cors",
  "request-id",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
